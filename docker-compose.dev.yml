version: '3.8'

services:
  miriam-postgres:
    image: postgres:15
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miriam -d miriam_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: miriam
      POSTGRES_PASSWORD: miriam_password
      POSTGRES_DB: miriam_dev
      POSTGRES_EXTRA_OPTS: "-c shared_buffers=128MB -c max_connections=50"
    ports:
      - "5432:5432"
    restart: unless-stopped

  miriam-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    restart: unless-stopped

  miriam-app:
    build: .
    environment:
      DATABASE_URL: postgresql://miriam:miriam_password@miriam-postgres:5432/miriam_dev
      REDIS_URL: redis://miriam-redis:6379/0
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_ENABLED: ${TYPESAFE_ENABLED:-true}
      # Shop document reading (stock books, invoices, delivery notes). Without
      # LLMAPI_API_KEY every read fails closed to the retake message.
      LLMAPI_API_KEY: ${LLMAPI_API_KEY:-}
      LLMAPI_BASE_URL: ${LLMAPI_BASE_URL:-https://api.llmapi.ai/v1}
      # Optional. The single Jev call each of these makes is a router decision,
      # so without TYPESAFE_API_KEY the router starts every read on the big
      # model and escalates rather than trusting a cheap read.
      READ_SMALL_MODEL: ${READ_SMALL_MODEL:-gemini-3.8-flash}
      READ_BIG_MODEL: ${READ_BIG_MODEL:-gpt-5.6-terra}
    ports:
      - "8000:8000"
      - "8001:8001"  # Hot reload port
    volumes:
      - ./miriam_agent:/app/miriam_agent
      - ./tests:/app/tests
    depends_on:
      miriam-postgres:
        condition: service_healthy
      miriam-redis:
        condition: service_healthy
    command: >-
      sh -c "
      pip install -e .[dev] && \
      uvicorn miriam_agent.cli:app --host 0.0.0.0 --port 8000 --reload"

  miriam-otel-collector:
    image: otel/opentelemetry-collector:0.92.0
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otel-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - miriam-app

volumes:
  postgres_data:
  redis_data:
