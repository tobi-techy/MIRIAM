[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miriam-agent"
version = "0.1.0"
description = "Production-grade financial agent with memory, planning, and safe money automation"
authors = [
    {name = "Miriam Team", email = "team@miriam.ai"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Accounting",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.23",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "redis>=5.0.1",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "openai>=1.3.0",
    "httpx>=0.25.0",
    "cryptography>=41.0.0",
    "pyjwt>=2.8.0",
    "prometheus-client>=0.19.0",
    "structlog>=23.2.0",
    "python-multipart>=0.0.3",
    "orjson>=3.9.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.3",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "isort>=5.13.2",
    "mypy>=1.7.1",
    "ruff>=0.1.9",
    "pre-commit>=3.6.1",
    "factory-boy>=3.3.0",
]

[project.scripts]
miriam-agent = "miriam_agent.cli:main"

[tool.hatch.build]
packages = ["miriam_agent"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v"
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_"
