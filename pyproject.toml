[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miriam-agent"
version = "0.1.0"
description = "Production-grade financial agent with memory, planning, and safe money automation"
authors = [
    {name = "Miriam Team", email = "team@miriam.ai"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Accounting",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.23",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "redis>=5.0.1",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "openai>=1.3.0",
    "httpx>=0.25.0",
    "cryptography>=41.0.0",
    "pyjwt>=2.8.0",
    "prometheus-client>=0.19.0",
    "structlog>=23.2.0",
    "python-multipart>=0.0.3",
    "orjson>=3.9.0",
    "click>=8.1.7",
    "numpy>=1.26.0",
    "grpcio>=1.60.0",
    "structlog>=23.2.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.6.0",
    "greenlet>=3.5.5",
    "pypdf>=6.19.0",
    "pytest-mock>=3.15.1",
    "typesafe-sdk>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.3",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "isort>=5.13.2",
    "mypy>=1.7.1",
    "ruff>=0.1.9",
    "pre-commit>=3.6.1",
    "factory-boy>=3.3.0",
]

[project.scripts]
miriam-agent = "miriam_agent.cli:main"
money-plan = "miriam_agent.money.demo:main"

[tool.hatch.build]
packages = ["miriam_agent"]

[tool.isort]
# Without this, isort and black disagree on how to wrap multi-line import
# statements, so running one after the other perpetually "fixes" what the
# other just changed and neither `black --check` nor `isort --check-only`
# can ever pass at the same time -- this is the standard, documented fix.
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# These files are dominated by long natural-language content (the personality
# system prompt, user-facing recommendation strings, and the TypeSafe question
# catalogs) where hard-wrapping mid-sentence would hurt readability for no real
# benefit. Line length is still enforced everywhere else.
"miriam_agent/agents/system_prompt.py" = ["E501"]
"miriam_agent/financial/intelligence.py" = ["E501"]
"miriam_agent/judgment/questions.py" = ["E501"]
"eval/typesafe_deep_eval.py" = ["E501"]

[tool.mypy]
# Not 3.11 (matching requires-python's floor): the installed numpy's type
# stubs use `type` statement syntax (PEP 695), which is 3.12+-only and
# mypy refuses to even parse below that -- this previously failed with a
# syntax error before checking a single line of our own code.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
# Aspirational, not enforced yet: most of this codebase predates type
# annotations entirely (disallow_untyped_defs alone accounted for the
# overwhelming majority of ~270 findings when first measured here). Turning
# it on wholesale would require annotating dozens of pre-existing files
# unrelated to any behavior change, which is its own separate project.
# New/actively-touched modules should still be annotated as a matter of
# style; this just stops CI from being permanently red over old code.
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v"
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_"
