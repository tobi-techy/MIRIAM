# OpenTelemetry Collector configuration for Miriam Agent.
# Referenced by docker-compose.dev.yml; forwards spans to a backend
# when OTEL_EXPORTER_OTLP_ENDPOINT is set (default: none / in-memory).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: basic

processors:
  batch:

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]