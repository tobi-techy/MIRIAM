version: '3.8'

services:
  miriam-postgres:
    # pgvector is required: 001_baseline runs CREATE EXTENSION vector and
    # memory_entries.embedding / scripts/init-db.sql depend on it. The stock
    # postgres:15-alpine image cannot satisfy this and exits on init.
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: miriam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: miriam_db
      POSTGRES_EXTRA_OPTS: "-c shared_buffers=256MB -c max_connections=100"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miriam -d miriam_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  miriam-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfilename appendonly.aof
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  miriam-app:
    build: .
    environment:
      # Production compose: all secrets are required via :? so a missing
      # .env fails fast with a named error instead of booting forgeable
      # defaults. For local dev use: docker compose -f docker-compose.dev.yml up
      DATABASE_URL: postgresql+asyncpg://miriam:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}@miriam-postgres:5432/miriam_db
      REDIS_URL: redis://miriam-redis:6379/0
      LOG_LEVEL: INFO
      ENVIRONMENT: production
      # The port uvicorn listens on. AtlasFlow probes http://<vm>:<PORT>/ and
      # defaults PORT to 3000, so this MUST be set here (and in the host env)
      # or the deploy never goes healthy. Keep it in step with Dockerfile EXPOSE.
      PORT: "8000"
      # Chat text must never mint ledger inflows. Hardcoded so a host shell
      # that exported the demo flag cannot boot this stack with it on.
      ALLOW_CHAT_INFLOW_SYNTH: "false"
      # Signing secrets MUST be set in the host environment. Production
      # refuses to boot with placeholders (config/settings.py) and compose
      # never embeds real secrets -- leave these alone and export e.g.
      #   JWT_SECRET=... SECRET_KEY=... ENCRYPTION_KEY=... POSTGRES_PASSWORD=...
      # before `docker compose up`.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      # Go access tokens have no aud. An explicit audience rejects them.
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_ISSUER: ${JWT_ISSUER:-rail_service}
      # Production refuses to boot without this. It is the only credential
      # allowed to mint ledger inflows (X-Rail-Service-Key). Same value as Go.
      RAIL_SERVICE_KEY: ${RAIL_SERVICE_KEY:?RAIL_SERVICE_KEY must be set}
      # The Go money authority. Production refuses to boot while this is the
      # localhost default (a container would probe itself); set it to the Go
      # service URL. Pair the credential above with Go's.
      GO_BACKEND_URL: ${GO_BACKEND_URL:?GO_BACKEND_URL must be set to the Go service URL}
      # The model key. Production refuses to boot without one of these; without
      # it every answerable turn fails at the model call.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CONCENTRATE_API_KEY: ${CONCENTRATE_API_KEY:-}
      # * keeps credentialed CORS off (see api/main.py). Set a real origin
      # list when a browser app must send cookies.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      # TypeSafe judgment layer (System One). On by default; activate it by
      # exporting TYPESAFE_API_KEY on the host. Without a key the agent runs the
      # pre-TypeSafe path unchanged.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_ENABLED: ${TYPESAFE_ENABLED:-true}
      # Shop document reading (stock books, invoices, delivery notes). Kept
      # optional like TYPESAFE_API_KEY rather than required: without the key the
      # service still boots and every read fails closed to the retake message,
      # which is better than a container that refuses to start over one feature.
      LLMAPI_API_KEY: ${LLMAPI_API_KEY:-}
      LLMAPI_BASE_URL: ${LLMAPI_BASE_URL:-https://api.llmapi.ai/v1}
      READ_SMALL_MODEL: ${READ_SMALL_MODEL:-gemini-3.8-flash}
      READ_BIG_MODEL: ${READ_BIG_MODEL:-gpt-5.6-terra}
      # Where a saved read lands. Postgres is the default; memory is for the
      # live eval only (it is lost on restart).
      SHOP_DOC_STORE: ${SHOP_DOC_STORE:-postgres}
    ports:
      - "8000:8000"
    depends_on:
      miriam-postgres:
        condition: service_healthy
      miriam-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
