version: '3.8'

services:
  miriam-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: miriam
      POSTGRES_PASSWORD: miriam_password
      POSTGRES_DB: miriam_db
      POSTGRES_EXTRA_OPTS: "-c shared_buffers=256MB -c max_connections=100"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miriam -d miriam_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  miriam-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfilename appendonly.aof
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  miriam-app:
    build: .
    environment:
      DATABASE_URL: postgresql://miriam:miriam_password@miriam-postgres:5432/miriam_db
      REDIS_URL: redis://miriam-redis:6379/0
      LOG_LEVEL: INFO
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      - miriam-postgres
      - miriam-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
