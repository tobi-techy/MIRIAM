name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: miriam
          POSTGRES_PASSWORD: miriam_password
          POSTGRES_DB: miriam_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run linter
        run: |
          black --check .
          isort --check-only .
          ruff check .

      # The tree carries pre-existing type errors (mixin attribute resolution,
      # SQLAlchemy declarative typing). Gating on zero would fail every build and
      # so check nothing; the ratchet fails only on a new error. See
      # docs/MYPY-BASELINE.md. Tighten it with scripts/mypy_ratchet.py --update.
      - name: Run mypy type checking (ratchet)
        run: python scripts/mypy_ratchet.py

      # Guards docs/miriam_spec/miriam_spec_v1.2.md against drifting from the
      # registry and examples in miriam_agent/spec. The document is loaded for
      # real: a missing, unreadable or empty spec fails here instead of
      # skipping. Ownership and history: CONTRIBUTION.md, "Spec ownership".
      - name: Run spec gate tests
        run: |
          pytest tests/test_miriam_spec.py tests/test_spec_examples.py -v
        env:
          PYTHONPATH: miriam_agent

      - name: Run tests
        run: |
          pytest tests/ -v --cov=miriam_agent --cov-report=xml
        env:
          DATABASE_URL: postgresql://miriam:miriam_password@localhost:5432/miriam_test
          REDIS_URL: redis://localhost:6379/0

  trust-gates:
    # The money trust boundary has a named gate: grounding, limits tiers,
    # exactly-once, shadow parity, and the hallucination eval. It runs without
    # Redis or network so a red gate always means the boundary regressed, never
    # that infra flaked.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Trust regression suites
        run: |
          pytest tests/test_trust_rails.py tests/test_execution_journal.py tests/test_shadow_parity.py tests/test_hallucination_eval.py tests/test_reply_guard.py tests/test_grounding_guard.py -q
        env:
          PYTHONPATH: miriam_agent

      - name: Shadow parity over the recorded corpus
        run: |
          python scripts/shadow_parity.py tests/fixtures/shadow/corpus.jsonl
        env:
          PYTHONPATH: miriam_agent

      - name: Upload coverage
        uses: codecov/codecov-action@e28ff129e5465c2c0dcc6f003fc735cb6ae0c673 # v4.5.0
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Check lockfile freshness
        run: |
          pip install uv
          uv lock --check

  capability-gate:
    # Runs the evidence behind every capability eval/capabilities.json claims
    # as proven, and holds when an area drops below its bar in
    # eval/capability_policy.py (trust areas: 100%). Deploys must require it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The dedupe evidence for C052 runs the real Postgres ON CONFLICT path
    # (tests/test_payment_refs_postgres.py): the conflict/rowcount semantics ARE
    # the guarantee, so they are proved on the deployment dialect, not a
    # lookalike. Without this service those node ids skip and the catalog
    # (correctly) refuses to count a skipped test as proof.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: miriam
          POSTGRES_PASSWORD: miriam_password
          POSTGRES_DB: miriam_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Capability gate
        run: python -m eval.capability_catalog
        env:
          PYTHONPATH: miriam_agent

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Blocking: a known CVE in a dependency fails the build. (The old
      # `safety check --full-report` step is gone: safety 3.x needs an
      # account key CI does not have, so it could never pass honestly.)
      #
      # The audit runs in its own venv against the project's declared deps.
      # Run plainly, `pip-audit` scans whatever happens to be installed in the
      # runner image's system Python (it used to report ~100 CVEs in
      # dist-packages packages the project never imports), so it never tested
      # the project at all.
      - name: Run pip-audit against the project deps
        run: |
          python -m venv .audit-venv
          . .audit-venv/bin/activate
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e .
          pip-audit --skip-editable --desc

      - name: Run semgrep
        run: |
          pip install semgrep
          semgrep --config=auto --severity=ERROR --quiet --error

  secret-scan:
    # Free, offline secret scanner (gitleaks; no account, no GitHub Secret
    # Protection). GitHub's free scanning only knows partner token formats and
    # push protection for repositories is a paid product, so this job is the
    # check that actually blocks. Two scans, both using .gitleaks.toml:
    #  1. the commits this push / pull request adds: any finding fails, no
    #     baseline, so a PR that introduces a secret cannot go green (the
    #     baseline file itself is skipped: it holds commit shas, which the
    #     stock token rules can mistake for tokens);
    #  2. the history reachable from the checked-out commit: fails only on a
    #     finding that is not in .gitleaks-baseline.json. Branches that are not
    #     an ancestor of this commit are not scanned here.
    # Findings are printed as rule, file:line, commit and date; values are
    # redacted. gitleaks makes no network calls; only the install step does.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Scan the commits in this push or pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          rc=0
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No usable base commit (new branch or force-push); the full-history scan below covers this range."
            exit 0
          fi
          echo "Scanning ${BASE_SHA}..${HEAD_SHA} ($(git rev-list --count "${BASE_SHA}..${HEAD_SHA}") commits)"
          gitleaks detect --source . --config .gitleaks.toml --redact=100 --no-banner --no-color \
            --log-opts="${BASE_SHA}..${HEAD_SHA} -- . :(exclude).gitleaks-baseline.json" --report-format json --report-path range.json || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::$(jq length range.json) secret finding(s) introduced by this change (values redacted):"
            jq -r '.[] | "  \(.RuleID)  \(.File):\(.StartLine)  \(.Commit[0:8])  \(.Date[0:10])"' range.json
          fi
          exit "$rc"

      - name: Scan full history against the baseline
        run: |
          set -uo pipefail
          rc=0
          [ "$(git rev-parse --is-shallow-repository)" = "false" ] || { echo "::error::shallow clone: history scan would be incomplete"; exit 1; }
          gitleaks detect --source . --config .gitleaks.toml --baseline-path .gitleaks-baseline.json \
            --redact=100 --no-banner --no-color --log-opts="--full-history HEAD" \
            --report-format json --report-path history.json || rc=$?
          echo "History: $(git rev-list --count --no-merges HEAD) non-merge commits scanned; $(jq length .gitleaks-baseline.json) baseline entries; $(jq length history.json) new finding(s) not in the baseline."
          if [ "$rc" -ne 0 ]; then
            echo "::error::New secret finding(s) in history that are not in .gitleaks-baseline.json (values redacted):"
            jq -r '.[] | "  \(.RuleID)  \(.File):\(.StartLine)  \(.Commit[0:8])  \(.Date[0:10])"' history.json
          fi
          exit "$rc"

      - name: Every baseline entry has a documented reason
        run: |
          set -uo pipefail
          missing=0
          while IFS=$'\t' read -r rule file; do
            if ! grep -qsF "| ${rule} | ${file} |" docs/SECRET-SCANNING-BASELINE.md; then
              echo "::error::Baseline entry without a note in docs/SECRET-SCANNING-BASELINE.md: ${rule}  ${file}"
              missing=1
            fi
          done < <(jq -r '.[] | [.RuleID, .File] | @tsv' .gitleaks-baseline.json | sort -u)
          exit "$missing"
