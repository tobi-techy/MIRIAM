name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: miriam
          POSTGRES_PASSWORD: miriam_password
          POSTGRES_DB: miriam_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d388a127769a75162d762 # v4.7.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run linter
        run: |
          black --check .
          isort --check-only .
          ruff check .

      - name: Run mypy type checking
        run: mypy miriam_agent

      - name: Run spec gate tests
        run: |
          uv run pytest tests/test_miriam_spec.py tests/test_spec_examples.py -v
        env:
          PYTHONPATH: miriam_agent

      - name: Run tests
        run: |
          pytest tests/ -v --cov=miriam_agent --cov-report=xml
        env:
          DATABASE_URL: postgresql://miriam:miriam_password@localhost:5432/miriam_test
          REDIS_URL: redis://localhost:6379/0

      - name: Upload coverage
        uses: codecov/codecov-action@e28ff129e5465c2dcc6f1f78d6ff3d2c74900d1c # v3.1.8
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Check lockfile freshness
        run: |
          pip install uv
          uv lock --check

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run safety check
        continue-on-error: true
        run: |
          pip install safety
          safety check --full-report

      - name: Run pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --desc

      - name: Run semgrep
        run: |
          pip install semgrep
          semgrep --config=auto --severity=ERROR --quiet --error
